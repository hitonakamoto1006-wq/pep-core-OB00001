[package]
name = "pep-desktop"
version = "0.1.0"
description = "PEP Chain Desktop Wallet"
authors = ["PEP Chain"]
edition = "2021"

[lib]
name = "pep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

pep-core = { path = "../../../crates/pep-core" }

serde = {
    version = "1",
    features = ["derive"]
}
