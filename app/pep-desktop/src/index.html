<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PEP Wallet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0b0b0f;
            color: #ffffff;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           TOP BAR
           ========================= */

        .topbar {
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            border-bottom: 1px solid #24242c;
            background: #0f0f14;

            flex: 0 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #8b5cf6;
            border-radius: 50%;

            color: #8b5cf6;

            font-weight: 700;
            font-size: 15px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* =========================
           NETWORK STATUS
           ========================= */

        .network {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            color: #8f8f9b;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            flex: 0 0 auto;

            border-radius: 50%;

            background: #777;
        }

        .status-dot.connected {
            background: #32d583;

            box-shadow:
                0 0 10px
                rgba(50, 213, 131, 0.5);
        }

        .status-dot.error {
            background: #ff4d6d;

            box-shadow:
                0 0 10px
                rgba(255, 77, 109, 0.4);
        }

        /* =========================
           CONTENT
           ========================= */

        .content {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 32px;

            overflow: auto;
        }

        /* =========================
           WALLET CARD
           ========================= */

        .wallet-card {
            width: 420px;

            padding: 40px;

            border: 1px solid #292932;
            border-radius: 18px;

            background: #111117;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);
        }

        .wallet-title {
            margin: 0 0 8px;

            font-size: 28px;
            font-weight: 700;
        }

        .wallet-subtitle {
            margin: 0 0 32px;

            color: #858592;
            font-size: 14px;
        }

        /* =========================
           CORE STATUS
           ========================= */

        .core-status {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 14px 16px;

            border-radius: 10px;

            background: #18181f;
            border: 1px solid #292932;

            margin-bottom: 28px;
        }

        .core-status-text {
            font-size: 13px;
            color: #a5a5b1;
        }

        /* =========================
           ACTIONS
           ========================= */

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            height: 48px;

            border: 0;
            border-radius: 10px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.1s ease,
                opacity 0.1s ease,
                background 0.15s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .primary {
            background: #7c3aed;
            color: #ffffff;
        }

        .primary:hover:not(:disabled) {
            background: #8b5cf6;
        }

        .secondary {
            background: #1c1c24;
            color: #ffffff;

            border: 1px solid #30303a;
        }

        .secondary:hover:not(:disabled) {
            background: #23232d;
        }

        /* =========================
           FOOTER
           ========================= */

        .footer {
            margin-top: 24px;

            text-align: center;

            color: #5f5f6b;

            font-size: 11px;
        }

        /* =========================
           BACKUP SCREEN
           ========================= */

        .backup-card {
            width: 620px;

            padding: 40px;

            border: 1px solid #292932;
            border-radius: 18px;

            background: #111117;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);
        }

        .screen-header {
            margin-bottom: 28px;
        }

        .screen-title {
            margin: 0 0 8px;

            font-size: 28px;
            font-weight: 700;
        }

        .screen-subtitle {
            margin: 0;

            color: #858592;
            font-size: 14px;
            line-height: 1.6;
        }

        .warning-box {
            display: flex;
            gap: 12px;

            padding: 16px;

            margin-bottom: 24px;

            border: 1px solid #59451d;
            border-radius: 10px;

            background: #1b1811;

            color: #d9c58b;

            font-size: 13px;
            line-height: 1.5;
        }

        .warning-icon {
            width: 22px;
            height: 22px;

            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #8a6419;

            color: #fff;

            font-size: 12px;
            font-weight: 700;
        }

        .mnemonic-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 20px;
        }

        .mnemonic-word {
            display: flex;
            align-items: center;
            gap: 8px;

            min-height: 48px;

            padding: 10px 12px;

            border: 1px solid #30303a;
            border-radius: 9px;

            background: #18181f;
        }

        .word-number {
            color: #686875;

            font-size: 11px;
            font-weight: 600;

            min-width: 18px;
        }

        .word-text {
            color: #ffffff;

            font-size: 13px;
            font-weight: 600;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .address-box {
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .field-label {
            display: block;

            margin-bottom: 8px;

            color: #747480;

            font-size: 11px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .address-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .address-value {
            flex: 1;

            min-width: 0;

            padding: 13px 14px;

            border: 1px solid #292932;
            border-radius: 9px;

            background: #18181f;

            color: #b8b8c3;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 11px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .small-button {
            width: auto;

            height: 44px;

            padding: 0 16px;

            flex: 0 0 auto;

            font-size: 12px;
        }

        .backup-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;

            margin-top: 22px;
        }

        .confirm-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            padding: 13px 14px;

            border: 1px solid #292932;
            border-radius: 9px;

            background: #15151c;

            cursor: pointer;
        }

        .confirm-row input {
            margin-top: 2px;

            width: 15px;
            height: 15px;

            accent-color: #7c3aed;

            cursor: pointer;
        }

        .confirm-text {
            color: #a5a5b1;

            font-size: 12px;
            line-height: 1.5;
        }

        /* =========================
           DASHBOARD
           ========================= */

        .dashboard {
            width: min(960px, 100%);

            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 22px 24px;

            border: 1px solid #292932;
            border-radius: 16px;

            background: #111117;
        }

        .dashboard-wallet-info {
            min-width: 0;
            flex: 1;
        }

        .dashboard-title {
            margin: 0 0 5px;

            font-size: 22px;
            font-weight: 700;
        }

        .dashboard-address-row {
            display: flex;
            align-items: center;
            gap: 6px;

            min-width: 0;
        }

        .dashboard-address {
            min-width: 0;
            max-width: 560px;

            color: #70707d;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 11px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dashboard-copy-button {
            width: 24px;
            height: 24px;

            padding: 0;

            flex: 0 0 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 6px;

            background: transparent;
            color: #777783;

            cursor: pointer;

            opacity: 0.8;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                opacity 0.15s ease;
        }

        .dashboard-copy-button:hover {
            background: #1c1c24;
            color: #ffffff;
            opacity: 1;
        }

        .dashboard-copy-button:active {
            transform: scale(0.94);
        }

        .dashboard-copy-button svg {
            width: 14px;
            height: 14px;

            display: block;
        }

        .dashboard-network {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #32d583;

            font-size: 12px;

            flex: 0 0 auto;
        }

        .balance-card {
            padding: 28px;

            border: 1px solid #292932;
            border-radius: 16px;

            background: #111117;
        }

        .balance-label {
            color: #777783;

            font-size: 12px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-value {
            margin-top: 10px;

            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .balance-symbol {
            margin-left: 7px;

            color: #858592;

            font-size: 16px;
            font-weight: 600;
        }

        .asset-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 14px;
        }

        .asset-card {
            padding: 20px;

            border: 1px solid #292932;
            border-radius: 14px;

            background: #111117;
        }

        .asset-name {
            color: #9a9aa6;

            font-size: 12px;
        }

        .asset-value {
            margin-top: 8px;

            font-size: 18px;
            font-weight: 650;
        }

        .dashboard-actions {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;
        }

        /* =========================
           RECEIVE SCREEN
           ========================= */

        .receive-screen {
            width: min(620px, 100%);

            padding: 28px;

            border: 1px solid #292932;
            border-radius: 18px;

            background: #111117;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);
        }

        .receive-header {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 24px;
        }

        .receive-back {
            width: 34px;
            height: 34px;

            padding: 0;

            flex: 0 0 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #292932;
            border-radius: 8px;

            background: transparent;
            color: #a5a5b1;

            font-size: 18px;
        }

        .receive-back:hover {
            background: #1c1c24;
            color: #ffffff;
        }

        .receive-header-text {
            min-width: 0;
        }

        .receive-title {
            margin: 0;

            color: #f2f2f5;

            font-size: 22px;
            font-weight: 700;
        }

        .receive-subtitle {
            margin: 4px 0 0;

            color: #777783;

            font-size: 12px;
        }

        .receive-card {
            padding: 20px;

            border-radius: 12px;

            background: #18181f;
            border: 1px solid #292932;
        }

        .receive-asset {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .receive-asset-name {
            color: #eeeeF4;

            font-size: 15px;
            font-weight: 700;
        }

        .receive-asset-type {
            margin-top: 3px;

            color: #696976;

            font-size: 10px;
        }

        .receive-asset-network {
            color: #2bd17e;

            font-size: 10px;
            font-weight: 700;
        }

        .receive-address-label {
            margin-bottom: 8px;

            color: #696976;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .receive-address-box {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 10px 10px 12px;

            border-radius: 9px;

            background: #111118;
            border: 1px solid #292932;
        }

        .receive-address {
            min-width: 0;
            flex: 1;

            color: #d9d9e2;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 12px;
            line-height: 1.5;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .receive-copy-button {
            width: 28px;
            height: 28px;

            padding: 0;

            flex: 0 0 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 6px;

            background: transparent;
            color: #777783;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .receive-copy-button:hover {
            background: #24242d;
            color: #ffffff;
        }

        .receive-copy-button:active {
            transform: scale(0.94);
        }

        .receive-copy-button svg {
            width: 14px;
            height: 14px;

            display: block;
        }

        .receive-note {
            margin-top: 14px;

            color: #62626f;

            font-size: 10px;
            line-height: 1.5;

            text-align: center;
        }

        /* =========================
           SEND SCREEN
           ========================= */

        .send-screen {
            width: min(620px, 100%);

            padding: 28px;

            border: 1px solid #292932;
            border-radius: 18px;

            background: #111117;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);
        }

        .send-header {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 24px;
        }

        .send-back {
            width: 34px;
            height: 34px;

            padding: 0;

            flex: 0 0 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #292932;
            border-radius: 8px;

            background: transparent;
            color: #a5a5b1;

            font-size: 18px;
        }

        .send-back:hover {
            background: #1c1c24;
            color: #ffffff;
        }

        .send-header-text {
            min-width: 0;
        }

        .send-title {
            margin: 0;

            color: #f2f2f5;

            font-size: 22px;
            font-weight: 700;
        }

        .send-subtitle {
            margin: 4px 0 0;

            color: #777783;

            font-size: 12px;
        }

        .send-card {
            padding: 20px;

            border-radius: 12px;

            background: #18181f;
            border: 1px solid #292932;
        }

        .send-asset {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 24px;
        }

        .send-asset-name {
            color: #eeeeF4;

            font-size: 15px;
            font-weight: 700;
        }

        .send-asset-type {
            margin-top: 3px;

            color: #696976;

            font-size: 10px;
        }

        .send-balance {
            color: #777783;

            font-size: 11px;
        }

        .send-balance strong {
            color: #d9d9e2;
        }

        .send-field {
            margin-bottom: 18px;
        }

        .send-label {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #696976;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .send-input-wrap {
            display: flex;
            align-items: center;

            min-height: 48px;

            border-radius: 9px;

            background: #111118;
            border: 1px solid #292932;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .send-input-wrap:focus-within {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 2px
                rgba(124, 58, 237, 0.12);
        }

        .send-input {
            width: 100%;

            min-width: 0;

            padding: 14px;

            border: 0;
            outline: 0;

            background: transparent;

            color: #ffffff;

            font-family: inherit;
            font-size: 13px;
        }

        .send-input::placeholder {
            color: #555562;
        }

        .send-amount-input {
            padding-right: 4px;
        }

        .send-max {
            width: auto;
            height: 30px;

            margin-right: 8px;
            padding: 0 9px;

            border-radius: 6px;

            background: #24242d;
            color: #9d7cff;

            font-size: 10px;
            font-weight: 700;
        }

        .send-max:hover {
            background: #30263f;
            color: #b39aff;
        }

        .send-unit {
            padding-right: 14px;

            color: #8d8d99;

            font-size: 12px;
            font-weight: 700;
        }

        .send-network {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 13px 14px;

            margin-bottom: 18px;

            border-radius: 9px;

            background: #15151c;
            border: 1px solid #292932;
        }

        .send-network-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .send-network-name {
            color: #bcbcc7;

            font-size: 12px;
        }

        .send-network-right {
            color: #32d583;

            font-size: 10px;
            font-weight: 700;
        }

        .send-fee-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;

            color: #696976;

            font-size: 11px;
        }

        .send-fee-value {
            color: #a5a5b1;
        }

        .send-error {
            min-height: 17px;

            margin-top: 7px;

            color: #ff5c7a;

            font-size: 10px;
        }

        .send-review {
            margin-top: 4px;
        }

        @media (max-width: 700px) {

            .content {
                padding: 20px;
            }

            .wallet-card,
            .backup-card,
            .receive-screen,
            .send-screen {
                width: 100%;
                padding: 28px;
            }

            .mnemonic-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .asset-grid {
                grid-template-columns:
                    1fr;
            }

            .dashboard-header {
                align-items: flex-start;

                flex-direction: column;

                gap: 12px;
            }

            .dashboard-actions {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
           TOAST
           ========================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 28px;

            transform:
                translateX(-50%)
                translateY(20px);

            opacity: 0;
            pointer-events: none;

            padding: 11px 16px;

            border: 1px solid #30303a;
            border-radius: 9px;

            background: #18181f;

            color: #ffffff;

            font-size: 12px;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            z-index: 1000;
        }

        .toast.visible {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }
        /* ==========================================
   IMPORT WALLET
   ========================================== */

.mnemonic-input {
    width: 100%;
    min-height: 150px;

    resize: vertical;

    padding: 14px;

    border: 1px solid #292932;
    border-radius: 9px;

    outline: none;

    background: #18181f;

    color: #ffffff;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size: 13px;

    line-height: 1.6;

    transition:
        border-color 0.15s ease,
        background 0.15s ease;
}

.mnemonic-input::placeholder {
    color: #5f5f6b;
}

.mnemonic-input:focus {
    border-color: #7c3aed;
    background: #1a1a22;
}

.import-word-count {
    margin-top: 8px;

    color: #686875;

    font-size: 11px;

    text-align: right;
}

.import-error {
    min-height: 18px;

    margin-top: 12px;

    color: #ff4d6d;

    font-size: 12px;
}
    </style>
</head>


<body>

<div class="app">

    <!-- =========================
         TOP BAR
         ========================= -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                P
            </div>

            <div class="brand-name">
                PEP Wallet
            </div>

        </div>


        <div class="network">

            <span
                id="status-dot"
                class="status-dot"
            ></span>

            <span id="network-status">
                Connecting
            </span>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main
        id="content"
        class="content"
    ></main>

</div>


<!-- =========================
     TOAST
     ========================= -->

<div
    id="toast"
    class="toast"
>
    Copied
</div>


<script>
(() => {

    let toastTimer = null;

    function showToast(message) {

        toast.textContent =
            message;

        toast.classList.add(
            "visible"
        );

        if (toastTimer) {

            clearTimeout(
                toastTimer
            );
        }

        toastTimer =
            setTimeout(() => {

                toast.classList.remove(
                    "visible"
                );

            }, 1800);
    }


    /* ==========================================
       COPY
       ========================================== */

    async function copyText(text, message) {

        if (!text) {
            return;
        }

        try {

            if (
                navigator.clipboard &&
                typeof navigator.clipboard.writeText === "function"
            ) {

                await navigator.clipboard.writeText(
                    text
                );

                showToast(
                    message || "Copied"
                );

                return;
            }

        } catch (error) {

            console.warn(
                "[PEP] navigator.clipboard failed:",
                error
            );
        }

        try {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            textarea.setAttribute(
                "readonly",
                ""
            );

            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";

            textarea.style.top =
                "0";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.focus();

            textarea.select();

            textarea.setSelectionRange(
                0,
                textarea.value.length
            );

            const copied =
                document.execCommand(
                    "copy"
                );

            textarea.remove();

            if (!copied) {

                throw new Error(
                    "Clipboard fallback failed"
                );
            }

            showToast(
                message || "Copied"
            );

        } catch (error) {

            console.error(
                "[PEP] Clipboard failed:",
                error
            );

            showToast(
                "Copy failed"
            );
        }
    }


    /* ==========================================

       ========================================== */

    function updateCoreStatus(status) {

        console.log(
            "[PEP] Core status:",
            status
        );

        const coreStatusElement =
            document.getElementById(
                "core-status"
            );

        const coreDot =
            document.getElementById(
                "core-dot"
            );

        if (!coreStatusElement) {

            if (
                status ===
                "PEP Core connected."
            ) {

                networkStatus.textContent =
                    "Connected";

                networkDot.classList.add(
                    "connected"
                );

                networkDot.classList.remove(
                    "error"
                );
            }

            return;
        }

        coreStatusElement.textContent =
            status;

        const connected =
            status ===
            "PEP Core connected.";

        const lowerStatus =
            status.toLowerCase();

        const error =
            lowerStatus.includes(
                "failed"
            ) ||
            lowerStatus.includes(
                "not found"
            ) ||
            lowerStatus.includes(
                "unable"
            ) ||
            lowerStatus.includes(
                "unavailable"
            );

        if (connected) {

            coreDot.classList.add(
                "connected"
            );

            coreDot.classList.remove(
                "error"
            );

            networkDot.classList.add(
                "connected"
            );

            networkDot.classList.remove(
                "error"
            );

            networkStatus.textContent =
                "Connected";

            const createButton =
                document.getElementById(
                    "create-wallet"
                );

            const importButton =
                document.getElementById(
                    "import-wallet"
                );

            if (createButton) {
                createButton.disabled = false;
            }

            if (importButton) {
                importButton.disabled = false;
            }

            return;
        }

        if (error) {

            coreDot.classList.remove(
                "connected"
            );

            coreDot.classList.add(
                "error"
            );

            networkDot.classList.remove(
                "connected"
            );

            networkDot.classList.add(
                "error"
            );

            networkStatus.textContent =
                "Offline";

            const createButton =
                document.getElementById(
                    "create-wallet"
                );

            const importButton =
                document.getElementById(
                    "import-wallet"
                );

            if (createButton) {
                createButton.disabled = true;
            }

            if (importButton) {
                importButton.disabled = true;
            }

            return;
        }

        coreDot.classList.remove(
            "connected"
        );

        coreDot.classList.remove(
            "error"
        );

        networkDot.classList.remove(
            "connected"
        );

        networkDot.classList.remove(
            "error"
        );

        networkStatus.textContent =
            "Connecting";

        const createButton =
            document.getElementById(
                "create-wallet"
            );

        const importButton =
            document.getElementById(
                "import-wallet"
            );

        if (createButton) {
            createButton.disabled = true;
        }

        if (importButton) {
            importButton.disabled = true;
        }
    }

    /* ==========================================
       BALANCE
       ========================================== */

    async function loadWalletBalance() {

        if (!walletAddress) {

            walletBalance = 0;
            walletAssets = [];
            walletNonce = 0;
            walletStake = 0;

            return null;
        }

        const tauri =
            window.__TAURI__;

        if (
            !tauri ||
            !tauri.core
        ) {

            throw new Error(
                "Tauri Core API unavailable."
            );
        }

        /*
         * QUAN TRỌNG:
         *
         * wallet_balance ở Rust tự lấy wallet
         * từ WalletSession rồi gọi:
         *
         * Client::get_balance("127.0.0.1:6000", ...)
         *
         * => luôn là Core local của máy hiện tại.
         */
        const result =
            await tauri.core.invoke(
                "wallet_balance"
            );

        if (
            !result ||
            !Array.isArray(result.balances)
        ) {

            throw new Error(
                "Invalid balance response from PEP Core."
            );
        }

        walletAssets =
            result.balances;

        walletNonce =
            Number(
                result.nonce || 0
            );

        walletStake =
            Number(
                result.stake || 0
            );

        const pep =
            walletAssets.find(
                item =>
                    String(
                        item.asset
                    ).toUpperCase() === "PEP"
            );

        walletBalance =
            pep
                ? Number(
                    pep.amount || 0
                )
                : 0;

        return result;
    }


    function getPepBalance() {

        return Number.isFinite(
            walletBalance
        )
            ? walletBalance
            : 0;
    }

                recipientInput.value.trim();

            const amount =
                amountInput.value.trim();

            recipientError.textContent =
                "";

            amountError.textContent =
                "";

            let valid = true;


            if (!recipient) {

                recipientError.textContent =
                    "Recipient address is required.";

                valid = false;

            } else if (
                !recipient
                    .toLowerCase()
                    .startsWith("pep")
            ) {

                recipientError.textContent =
                    "Invalid PEP address.";

                valid = false;
            }


            if (!amount) {

                amountError.textContent =
                    "Amount is required.";

                valid = false;

            } else {

                const numericAmount =
                    Number(amount);

                if (
                    !Number.isFinite(
                        numericAmount
                    ) ||
                    numericAmount <= 0
                ) {

                    amountError.textContent =
                        "Enter a valid amount.";

                    valid = false;

                } else if (
                    numericAmount >
                    getPepBalance()
                ) {

                    amountError.textContent =
                        "Insufficient PEP balance.";

                    valid = false;
                }
            }


            reviewButton.disabled =
                !valid;

            return valid;

        );

                    amountInput.value

                            /[^0-9.]/g,
                            ""
                        );

                const parts =
                    amountInput.value.split(
                        "."
                    );

                if (parts.length > 2) {

                    amountInput.value =
                        parts[0]
                        + "."
                        + parts

    /* ==========================================
       HTML ESCAPE
       ========================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* ==========================================
       CORE STATUS QUERY
       ========================================== */

    async function getCoreStatus() {

        console.log(
            "[PEP] Checking Tauri API..."
        );

        const tauri =
            window.__TAURI__;

        if (!tauri) {

            console.error(
                "[PEP] window.__TAURI__ unavailable"
            );

            updateCoreStatus(
                "Desktop API unavailable."
            );

            return;
        }

        if (!tauri.core) {

            console.error(
                "[PEP] Tauri core API unavailable"
            );

            updateCoreStatus(
                "Desktop Core API unavailable."
            );

            return;
        }

        try {

            const status =
                await tauri.core.invoke(
                    "core_status"
                );

            console.log(
                "[PEP] Initial Core status:",
                status
            );

            updateCoreStatus(

            );

        } catch (error) {

            console.error(
                "[PEP] core_status failed:",
                error
            );

            updateCoreStatus(
                "Unable to query PEP Core."
            );
        }
    }


    /* ==========================================
       CORE STATUS EVENTS
       ========================================== */

    async function listenCoreStatus() {

        const tauri =
            window.__TAURI__;

        if (
            !tauri ||
            !tauri.event
        ) {
            return;
        }

        try {

            await tauri.event.listen(
                "core-status",
                (event) => {

                    console.log(
                        "[PEP] Core event:",
                        event.payload
                    );

                    updateCoreStatus(
                        event.payload
                    );
                }
            );

        } catch (error) {

            console.error(
                "[PEP] Event listener failed:",
                error
            );
        }
    }


    /* ==========================================
       START
       ========================================== */

    async function start() {

        console.log(
            "[PEP] PEP Wallet UI started."
        );

        renderHome();

        await listenCoreStatus();

        await getCoreStatus();

        const statusTimer =
            setInterval(

                    const statusElement =
                        document.getElementById(
                            "core-status"
                        );

                    if (!statusElement) {

                        clearInterval(
                            statusTimer
                        );

                        return;
                    }

                    const status =
                        statusElement.textContent;

                    if (
                        status ===
                        "PEP Core connected."
                    ) {

                        clearInterval(
                            statusTimer
                        );

                        return;
                    }

                    await getCoreStatus();

                },
                500
            );
    }


    /* ==========================================
       BOOT
       ========================================== */

    start();

})();

    async function copyText(text, message) {

        if (!text) {
            return;
        }

        try {

            if (
                navigator.clipboard &&
                typeof navigator.clipboard.writeText === "function"
            ) {

                await navigator.clipboard.writeText(
                    text
                );

                showToast(
                    message || "Copied"
                );

                return;
            }

        } catch (error) {

            console.warn(
                "[PEP] navigator.clipboard failed:",
                error
            );
        }

        try {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            textarea.setAttribute(
                "readonly",
                ""
            );

            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";

            textarea.style.top =
                "0";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.focus();

            textarea.select();

            textarea.setSelectionRange(
                0,
                textarea.value.length
            );

            const copied =
                document.execCommand(
                    "copy"
                );

            textarea.remove();

            if (!copied) {

                throw new Error(
                    "Clipboard fallback failed"
                );
            }

            showToast(
                message || "Copied"
            );

        } catch (error) {

            console.error(
                "[PEP] Clipboard failed:",
                error
            );

            showToast(
                "Copy failed"
            );
        }

        if (!coreStatusElement) {

            if (

                networkStatus.textContent =
                    "Connected";

                networkDot.classList.add(
                    "connected"
                );

                networkDot.classList.remove(
                    "error"
                );
            }

            return;
        }

        coreStatusElement.textContent =
            status;

        const connected =
            status ===
            "PEP Core connected.";

        const lowerStatus =
            status.toLowerCase();

        const error =
            lowerStatus.includes(
                "failed"
            ) ||
            lowerStatus.includes(
                "not found"
            ) ||
            lowerStatus.includes(
                "unable"
            ) ||
            lowerStatus.includes(
                "unavailable"
            );

        if (connected) {

            coreDot.classList.add(
                "connected"
            );

            coreDot.classList.remove(
                "error"

            networkDot.classList.add(
                "connected"

            networkStatus.textContent =
                "Connected";

            if (createButton) {

            return;

        if (error) {

            coreDot.classList.remove(
                "connected"

            coreDot.classList.add(
                "error"
            );

            networkDot.classList.remove(
                "connected"
            );

            networkDot.classList.add(
                "error"
            );

                "Offline";

            const createButton =
                document.getElementById(
                    "create-wallet"

            if (createButton) {
                createButton.disabled = true;
            }

                importButton.disabled = true;
            }

            return;
        }

        coreDot.classList.remove(
            "connected"
        );

        coreDot.classList.remove(
            "error"
        );

        networkDot.classList.remove(
            "connected"
        );

        networkDot.classList.remove(
            "error"
        );

        networkStatus.textContent =
            "Connecting";

        const createButton =
            document.getElementById(
                "create-wallet"
            );

        const importButton =
            document.getElementById(
                "import-wallet"
            );

        if (createButton) {
            createButton.disabled = true;
        }

        if (importButton) {
            importButton.disabled = true;
        }
    }

    /* ==========================================
       BALANCE
       ========================================== */

    async function loadWalletBalance() {

        if (!walletAddress) {

            walletBalance = 0;
            walletAssets = [];
            walletNonce = 0;
            walletStake = 0;

            return null;
        }

        const tauri =
            window.__TAURI__;

        if (
            !tauri ||
            !tauri.core
        ) {

            throw new Error(
                "Tauri Core API unavailable."
            );
        }

        /*
         * QUAN TRỌNG:
         *
         * wallet_balance ở Rust tự lấy wallet
         * từ WalletSession rồi gọi:
         *
         * Client::get_balance("127.0.0.1:6000", ...)
         *
         * => luôn là Core local của máy hiện tại.
         */
        const result =
            await tauri.core.invoke(
                "wallet_balance"
            );

        if (
            !result ||
            !Array.isArray(result.balances)
        ) {

            throw new Error(
                "Invalid balance response from PEP Core."
            );
        }

        walletAssets =
            result.balances;

        walletNonce =
            Number(
                result.nonce || 0
            );

        walletStake =
            Number(
                result.stake || 0
            );

        const pep =
            walletAssets.find(
                item =>
                    String(
                        item.asset
                    ).toUpperCase() === "PEP"
            );

        walletBalance =
            pep
                ? Number(
                    pep.amount || 0
                )
                : 0;

        return result;
    }


    function getPepBalance() {

        return Number.isFinite(
            walletBalance
        )
            ? walletBalance
            : 0;
    }

        function validateSendForm() {

            const recipient =

            recipientError.textContent =
                "";

            amountError.textContent =
                "";

            let valid = true;


            if (!recipient) {

                recipientError.textContent =
                    "Recipient address is required.";

                valid = false;

            } else if (
                !recipient
                    .toLowerCase()
                    .startsWith("pep")
            ) {

                    "Invalid PEP address.";

                valid = false;
            }


            if (!amount) {

                amountError.textContent =

                    Number(amount);

                if (
                    !Number.isFinite(
                        numericAmount
                    ) ||
                    numericAmount <= 0
                ) {

                    amountError.textContent =
                        "Enter a valid amount.";

                    valid = false;

                    getPepBalance()
                ) {

                }

            reviewButton.disabled =
                !valid;

            return valid;

        );

                const recipient =
                    recipientInput.value.trim();

                const amount =
                    amountInput.value.trim();

                const numericAmount =
                    Number(amount);

                if (
                    !Number.isFinite(
                        numericAmount
                    ) ||
                    numericAmount <= 0
                ) {
                    return;
                }

                /*
                 * Check one more time against
                 * current local Core balance.
                 */
                try {

                    await loadWalletBalance();

                } catch (error) {

                    console.error(
                        "[PEP] Pre-transfer balance refresh failed:",
                        error
                    );

                    showToast(
                        "Cannot read wallet balance"
                    );

                    return;
                }

                if (
                    numericAmount >
                    getPepBalance()
                ) {

                    amountError.textContent =
                        "Insufficient PEP balance.";

                    return;
                }

                reviewButton.disabled =
                    true;

                reviewButton.textContent =
                    "Sending...";

                try {

                    const tauri =
                        window.__TAURI__;

                    if (
                        !tauri ||
                        !tauri.core
                    ) {

                        throw new Error(
                            "Tauri Core API unavailable."
                        );
                    }

                    /*
                     * Gọi Rust:
                     *
                     * transfer(
                     *     wallet_session,
                     *     to,
                     *     amount
                     * )
                     *
                     * Rust tự ký bằng WalletSession
                     * và broadcast tới 127.0.0.1:6000.
                     */
                    const result =
                        await tauri.core.invoke(
                            "transfer",
                            {
                                to: recipient,
                                amount: numericAmount
                            }
                        );

                    console.log(
                        "[PEP] Transfer result:",
                        result
                    );

                    showToast(
                        result ||
                        "Transfer transaction broadcast."
                    );

                    /*
                     * Chờ Core xử lý rồi đọc lại balance.
                     */
                    setTimeout(
                        async () => {

                            try {

                                await loadWalletBalance();

                            } catch (error) {

                                console.warn(
                                    "[PEP] Post-transfer balance refresh failed:",
                                    error
                                );
                            }

                        },
                        500
                    );

                } catch (error) {

                    console.error(
                        "[PEP] Transfer failed:",
                        error
                    );

                    showToast(
                        String(
                            error ||
                            "Transfer failed"
                        )
                    );

                } finally {

                    reviewButton.disabled =
                        false;

                    reviewButton.textContent =
                        "Review Send";

                    validateSendForm();
                }
            }
        );
    }

    /* ==========================================
       HTML ESCAPE
       ========================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

            updateCoreStatus(
                "Desktop API unavailable."
            );

            return;
        }

        if (!tauri.core) {

            console.error(
                "[PEP] Tauri core API unavailable"
            );

            updateCoreStatus(
                "Desktop Core API unavailable."
            );

            return;
        }

        try {

            const status =
                await tauri.core.invoke(
                    "core_status"
                );

            console.log(
                "[PEP] Initial Core status:",
                status
            );

            updateCoreStatus(
                status
            );

        } catch (error) {

            console.error(
                "[PEP] core_status failed:",
                error
            );

            updateCoreStatus(
                "Unable to query PEP Core."
            );
        }
    }


    /* ==========================================
       CORE STATUS EVENTS
       ========================================== */

    async function listenCoreStatus() {

        const tauri =
            window.__TAURI__;

        if (
            !tauri ||
            !tauri.event
        ) {
            return;
        }

        try {

            await tauri.event.listen(
                "core-status",
                (event) => {

                    console.log(
                        "[PEP] Core event:",
                        event.payload
                    );

                    updateCoreStatus(
                        event.payload
                    );
                }
            );

        } catch (error) {

            console.error(
                "[PEP] Event listener failed:",
                error
            );
        }
    }


    /* ==========================================
       START
       ========================================== */

    async function start() {

        console.log(
            "[PEP] PEP Wallet UI started."
        );

        renderHome();

        await listenCoreStatus();

        await getCoreStatus();

        const statusTimer =
            setInterval(
                async () => {

                    const statusElement =
                        document.getElementById(
                            "core-status"
                        );

                    if (!statusElement) {

                        clearInterval(
                            statusTimer
                        );

                        return;
                    }

                    const status =
                        statusElement.textContent;

                    if (
                        status ===
                        "PEP Core connected."
                    ) {

                        clearInterval(
                            statusTimer
                        );

                        return;
                    }

                    await getCoreStatus();

                },
                500
            );
    }


    /* ==========================================
       BOOT
       ========================================== */

    start();

})();
</script>
